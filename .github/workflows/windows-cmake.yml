name: Windows CMake

on:
  push:
  pull_request:

jobs:
  build:
    continue-on-error: true
    strategy:
      matrix:
        arch:
          - name: x86
            prefix: i686-w64-mingw32
          - name: x86_64
            prefix: x86_64-w64-mingw32

    runs-on: ubuntu-latest
    env:
      PREFIX: ${{ matrix.arch.prefix }}
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Install dependencies
        run: |
          sudo apt update
          [ "${{ matrix.arch.name }}" = "x86" ] && PKGSUFFIX="i686" || PKGSUFFIX="x86-64"
          sudo apt install -y gcc-mingw-w64-$PKGSUFFIX binutils-mingw-w64-$PKGSUFFIX ninja-build

      - name: Configure CMake
        run: echo ${VCPKG_ROOT}

      - name: Build SRB2
        run: |
          [ "${{ matrix.arch.name }}" = "x86" ] && IS64BIT="" || IS64BIT="64"
          cmake -B build.cmake -G "Unix Makefiles" -DVCPKG_TARGET_TRIPLET=x64-mingw-static

      - name: Upload artifacts
        uses: actions/upload-artifact@v6.0.0
        with:
          name: srb2banpyura-windows-cmake-${{ matrix.arch.name }}-${{ github.sha }}
          path: |
            bin/
