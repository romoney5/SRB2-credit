name: Ubuntu

on:
  push:
  pull_request:

env:
  CC: gcc

jobs:
  build:
    continue-on-error: true
    strategy:
      matrix:
        arch:
          - runner: ubuntu-latest
            name: x86_64
          - runner: ubuntu-24.04-arm
            name: aarch64

    name: ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}

    steps:
    - uses: actions/checkout@v6.0.1

    - name: Install dependencies
      run: |
       sudo apt-get update
       sudo apt install -y libsdl2-mixer-dev libpng-dev libcurl4-openssl-dev libgme-dev libminiupnpc-dev libopenmpt-dev

    - name: Build SRB2
      run: make -C src/ --keep-going -j$(nproc) LINUX64=1

    - name: Build SRB2 (dedicated)
      run: make -C src/ --keep-going -j$(nproc) LINUX64=1 DEDICATED=1

    - name: Upload build artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: srb2banpyura-linux-${{ matrix.arch.name }}-${{ github.sha }}
        path: |
          bin/
